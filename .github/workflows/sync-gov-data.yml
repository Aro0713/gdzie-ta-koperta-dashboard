name: Sync Gov Data (ETL & Spatial Conflation)

on:
  schedule:
    # Uruchamianie w każdą niedzielę o 03:00 UTC w nocy (niski ruch, aktualne rejestry)
    - cron: '0 3 * * 0'
  workflow_dispatch:
    inputs:
      city:
        description: 'Wybierz miasto do synchronizacji (pozostaw puste dla wszystkich)'
        required: false
        default: ''
        type: choice
        options:
          - ''
          - 'gdansk'
          - 'wroclaw'
          - 'poznan'

jobs:
  sync-gov-data:
    name: Run GovTech Spatial Conflation ETL
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ETL Sync Script
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${{ github.event.inputs.city }}" ]; then
            echo "Uruchamianie synchronizacji dla wybranego miasta: ${{ github.event.inputs.city }}"
            npm run etl:sync -- --city=${{ github.event.inputs.city }}
          else
            echo "Uruchamianie pełnej synchronizacji (wszystkie adaptery)"
            npm run etl:sync
          fi

      - name: Revalidate Next.js Cache (Zero-Downtime)
        env:
          APP_URL: ${{ secrets.APP_URL || 'https://gdzietakoperta.pl' }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
        run: |
          echo "Wysyłanie sygnału rewalidacji cache Next.js do ${APP_URL}..."
          curl -s -X POST "${APP_URL}/api/revalidate?secret=${REVALIDATE_SECRET}" \
            -H "Content-Type: application/json" || echo "Uwaga: Nie udało się wywołać rewalidacji zewnętrznej (brak skonfigurowanego APP_URL lub serwer niedostępny). Cache wygaśnie automatycznie po czasie revalidate."
